<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>solarized</title></title>
<meta name="description" content="All my social profiles in one place">
<meta name="theme-color" content="#e8ecf4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AB%A7%3C/text%3E%3C/svg%3E">
<style>

/* disclaimer: i vibecoded most of this cuz im lazy */

:root{
  --page:#e8ecf4; --ink:#1d1d1f; --ink-2:rgba(29,29,31,.66);
  --glass:rgba(255,255,255,.34); --sheet:rgba(255,255,255,.7);
  --rim:rgba(255,255,255,.9); --shadow:rgba(40,50,90,.24);
  --veil:rgba(255,255,255,.16); --bg-dim:1; --accent:#0a84ff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#07090f; --ink:#f5f5f7; --ink-2:rgba(245,245,247,.68);
    --glass:rgba(255,255,255,.09); --sheet:rgba(28,30,42,.62);
    --rim:rgba(255,255,255,.3); --shadow:rgba(0,0,0,.55);
    --veil:rgba(5,8,18,.4); --bg-dim:.6;
  }
}
:root[data-theme="dark"]{
  --page:#07090f; --ink:#f5f5f7; --ink-2:rgba(245,245,247,.68);
  --glass:rgba(255,255,255,.09); --sheet:rgba(28,30,42,.62);
  --rim:rgba(255,255,255,.3); --shadow:rgba(0,0,0,.55);
  --veil:rgba(5,8,18,.4); --bg-dim:.6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.bg{position:fixed;inset:-12%;z-index:-2;background-color:var(--page);background-size:cover;background-position:center;
  background-image:radial-gradient(40% 36% at 20% 24%,#5b8cff,transparent 70%),radial-gradient(34% 40% at 82% 18%,#ff7ab8,transparent 70%),radial-gradient(44% 40% at 72% 82%,#ffb36b,transparent 70%),radial-gradient(40% 40% at 24% 86%,#6be3c9,transparent 70%);
  filter:blur(var(--bg-blur,40px)) saturate(1.15) brightness(var(--bg-dim))}
.bg{will-change:transform}
.veil{position:fixed;inset:0;z-index:-1;background:var(--veil)}
  
.glass{position:relative;isolation:isolate;background:var(--glass);border-radius:var(--r,26px);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--rim),inset 0 -12px 22px -16px var(--rim),0 18px 40px -18px var(--shadow),0 2px 6px rgba(0,0,0,.06);
  transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(190px circle at var(--mx,50%) var(--my,-30%),rgba(255,255,255,.36),transparent 65%)}
.glass:hover::after{opacity:1}

*{-webkit-tap-highlight-color:transparent}
a,button{touch-action:manipulation;-webkit-touch-callout:none}
button{font:inherit;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
.page{--gap:14px;max-width:560px;margin:0 auto;padding:72px 16px 56px;display:flex;flex-direction:column;align-items:center;gap:var(--gap)}
.page>*{width:100%}
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-bottom:6px;will-change:transform,opacity}
.rise{animation:rise .8s cubic-bezier(.2,.9,.25,1.05) backwards;animation-delay:var(--dl,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes drop{from{opacity:0;transform:translateY(.4em) scale(.85)}}
@keyframes spin{to{rotate:360deg}}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
.avatar{--r:50%;width:120px;aspect-ratio:1;padding:6px;margin-bottom:4px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.halo{position:absolute;inset:-9px;z-index:-1;border-radius:50%;background:conic-gradient(#5b8cff,#ff7ab8,#ffb36b,#6be3c9,#5b8cff);filter:blur(14px);opacity:.6;animation:spin 9s linear infinite}
h1{margin:0;font-size:clamp(2.6rem,11vw,5.5rem);line-height:1;letter-spacing:-.045em;font-weight:700}
.wd{display:inline-block;white-space:nowrap}
.ch{display:inline-block;animation:drop .9s cubic-bezier(.2,.9,.25,1.15) backwards;animation-delay:calc(var(--i)*45ms + 250ms)}
.tagline{margin:0;color:var(--ink-2);font-size:1.1rem}
.chip{--r:999px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;font-size:.88rem;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:#30d158;animation:pulse 2s infinite}

.prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:7;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,#5b8cff,#ff7ab8,#ffb36b)}
.bar{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:14px;z-index:5;display:flex;gap:10px}
.tool{--r:50%;width:44px;height:44px;border:0;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool:active{scale:.9}
#top{opacity:0;scale:.6;pointer-events:none;transition:opacity .3s,scale .4s cubic-bezier(.3,1.4,.5,1)}
#top.show{opacity:1;scale:1;pointer-events:auto}
.toast{--r:999px;position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));z-index:6;padding:12px 20px;font-size:.9rem;translate:-50% 20px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,translate .4s cubic-bezier(.2,.9,.25,1.2),visibility .4s}
.toast.show{opacity:1;visibility:visible;translate:-50% 0}

.links{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.link{--r:28px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i a" "t t";gap:16px 8px;padding:16px;color:inherit;text-decoration:none;
  transform:perspective(700px) translateY(var(--ty,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,scale .2s}
.link:last-child:nth-child(odd){grid-column:1/-1}
.link:hover{--ty:-3px}
.link:active{scale:.97}
.ico{grid-area:i;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--page)}
.ico svg{width:20px;height:20px;fill:currentColor}
.ico svg.s{fill:none;stroke:currentColor;stroke-width:2}
.arrow{grid-area:a;justify-self:end;color:var(--ink-2);transition:transform .3s}
.link:hover .arrow{transform:translate(2px,-2px)}
.txt{grid-area:t;min-width:0}
.txt b{display:block;font-weight:600;font-size:1.02rem}
.txt small{color:var(--ink-2);font-size:.88rem;overflow-wrap:anywhere}
.legal-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.legal-nav a{--r:999px;min-height:44px;display:inline-flex;align-items:center;padding:0 20px;font-size:.88rem;color:var(--ink-2);text-decoration:none}
.legal-nav a:hover{color:var(--ink)}

.intro{--r:32px;padding:clamp(24px,5vw,36px)}
.intro p{margin:0;font-size:clamp(1.25rem,3.4vw,1.8rem);line-height:1.3;font-weight:600;letter-spacing:-.02em}
.w{opacity:.16}
.reveal{opacity:0;transform:translateY(26px) scale(.97);transition:opacity .7s,transform .8s cubic-bezier(.2,.9,.25,1)}
.reveal.in{opacity:1;transform:none}
.contact{--r:999px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 22px}
.contact span{min-width:0}
.contact b{display:block}
.contact small{color:var(--ink-2);overflow-wrap:anywhere}
.btn{min-height:44px;padding:0 22px;border:0;border-radius:999px;background:var(--ink);color:var(--page);font-weight:600;cursor:pointer;white-space:nowrap}

.arcade{--r:32px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.arcade>*{width:min(100%,300px)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:rgba(127,127,127,.16)}
.seg button{position:relative;z-index:1;min-height:40px;border:0;background:none;color:var(--ink-2);font-weight:600;cursor:pointer;transition:color .3s}
.seg button.on{color:var(--ink)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--glass);box-shadow:inset 0 1px 0 var(--rim),0 4px 12px -4px var(--shadow);transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
.arcade[data-g="tetris"] .pill{transform:translateX(100%)}
.arcade[data-g="snake"] [data-k="X"]{visibility:hidden}
.stack{position:relative;border-radius:22px;overflow:hidden;background:rgba(127,127,127,.12)}
canvas{display:block;width:100%;height:auto;aspect-ratio:280/320;touch-action:none}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.over b{font-size:1.4rem;letter-spacing:-.02em}
.over span{color:var(--ink-2);font-size:.9rem;text-align:center;padding:0 16px}
.over .btn{margin-top:10px}
.hud{display:flex;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.hud b{color:var(--ink)}
.pad{display:none;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{min-height:48px;border:0;border-radius:16px;background:rgba(127,127,127,.18);color:var(--ink);font-size:1.1rem}
.pad button:active{scale:.92}
@media (pointer:coarse){.pad{display:grid}}

.glow{position:fixed;left:0;top:0;width:420px;height:420px;margin:-210px 0 0 -210px;z-index:-1;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .5s;will-change:transform;background:radial-gradient(circle,rgba(140,170,255,.42),transparent 65%)}
.avatar{transform:perspective(600px) rotateX(var(--ax,0deg)) rotateY(var(--ay,0deg));transition:transform .25s ease-out}
.avatar img{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.tagline{min-height:1.5em}
.swap{animation:swap .6s cubic-bezier(.2,.9,.25,1) backwards}
@keyframes swap{from{opacity:0;transform:translateY(10px)}}
.ch{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.ico{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
@media (hover:hover){
  .ch:hover{transform:translateY(-.1em) scale(1.08)}
  .link:hover .ico{transform:rotate(-10deg) scale(1.12)}
}
.link,.legal-nav a,.tool,.btn{position:relative;overflow:hidden}
.rip{position:absolute;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);animation:rip .6s ease-out forwards}
@keyframes rip{from{transform:scale(0);opacity:1}to{transform:scale(1.6);opacity:0}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{50%{transform:scale(1.12)}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

@keyframes bloom{from{opacity:0}}
.bg{animation:bloom 1.6s ease-out}
.ch{animation:drop .9s cubic-bezier(.2,.9,.25,1.15) backwards,wave 5s ease-in-out infinite;animation-delay:calc(var(--i)*45ms + 250ms),calc(var(--i)*140ms + 2s)}
@keyframes wave{0%,55%,100%{translate:0 0}25%{translate:0 -.07em}}
.ico{position:relative}
.ico::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--ink-2);opacity:0;animation:ping 4s ease-out infinite;animation-delay:calc(var(--n,0)*.7s + 2.5s)}
@keyframes ping{0%{transform:scale(1);opacity:.5}60%,100%{transform:scale(1.7);opacity:0}}
.over .btn{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
@media (hover:hover){.legal-nav a:hover{transform:translateY(-2px)}}
  
.avatar.rect{--r:30px}
.avatar.rect img{border-radius:24px}
.avatar.rect .halo{border-radius:inherit;animation:glowpulse 4s ease-in-out infinite}
@keyframes glowpulse{50%{opacity:.3}}

/* mobile */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:clip}
canvas{touch-action:pan-y}
.arcade[data-s="play"] canvas{touch-action:none}
.sheet-body{overscroll-behavior:contain}
@media (max-width:420px){
  .page{padding:68px max(14px,env(safe-area-inset-right,0px)) 48px max(14px,env(safe-area-inset-left,0px))}
  .bar{gap:8px;right:10px}
  .links{gap:10px}
  .link{--r:24px;padding:14px}
  .legal-nav a{padding:0 16px}
  .contact{padding-left:18px}
  .sheet-head{padding:16px 12px 8px 20px}
  .sheet-body{padding:4px 20px 24px}
}
@media (max-width:340px){.links{grid-template-columns:1fr}}

/* for the low enders */
.lite .glass,.lite .over,.lite .sheet{-webkit-backdrop-filter:none;backdrop-filter:none}
.lite .glass{background:var(--sheet)}
.lite .glass::after,.lite .halo,.lite .glow,.lite .rip{display:none}
.lite .avatar img,.lite .tagline,.lite .ico::after,.lite .over .btn,.lite .bg{animation:none}
.lite .ch{animation:drop .9s cubic-bezier(.2,.9,.25,1.15) backwards;animation-delay:calc(var(--i)*45ms + 250ms)}

dialog{border:0;padding:0;margin:auto;background:transparent;color:var(--ink);width:min(680px,calc(100vw - 24px));max-width:none;overflow:visible}
dialog::backdrop{background:rgba(10,14,28,.38);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sheet{display:flex;flex-direction:column;max-height:min(82vh,780px);max-height:min(82svh,780px);border-radius:32px;overflow:hidden;background:var(--sheet);
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 var(--rim),0 30px 80px -20px var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 10px 28px}
.sheet-head h2{margin:0;font-size:1.5rem;letter-spacing:-.02em}
.close{width:44px;height:44px;border:0;border-radius:50%;cursor:pointer;color:var(--ink);background:rgba(127,127,127,.2);font-size:1.4rem;line-height:1}
.sheet-body{overflow:auto;padding:4px 28px 30px;line-height:1.6;font-size:.95rem}
.sheet-body h3{font-size:1rem;margin:1.5em 0 .3em}
.sheet-body p{margin:.25em 0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .w{opacity:1!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="bg" id="bg"></div><div class="veil"></div><div class="glow" id="glow"></div>

<div class="prog" id="prog"></div>
<div class="bar">
  <button class="glass tool" id="top" aria-label="Back to top"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  <button class="glass tool" id="bgBtn" aria-label="Change background" title="Change background (hold to reset)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></button><input type="file" id="bgFile" accept="image/*" hidden>
  <button class="glass tool" id="theme" aria-label="Toggle light or dark mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/></svg></button>
  <button class="glass tool" id="share" aria-label="Share this page"><svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></button>
</div>

<main class="page">
  <header class="hero" id="hero">
    <div class="glass avatar rise" style="--dl:100ms"><i class="halo"></i><img id="avatar" alt="Profile picture"></div>
    <h1 id="name"></h1>
    <p class="tagline rise" style="--dl:800ms" id="tagline"></p>
    <div><div class="glass chip rise" style="--dl:880ms"><i class="dot"></i><span id="clock"></span></div></div>
  </header>
  <div class="glass contact rise" style="--dl:940ms"><span><b>Business inquiries</b><small id="mail"></small></span><button class="btn" id="copyMail">Copy email</button></div>
  <nav class="links" id="links" aria-label="Social profiles"></nav>
  <nav class="legal-nav" id="legalNav" aria-label="Legal"></nav>
  <br>
  <section class="glass intro" id="intro"><p id="introText"></p></section>
  <br>
  <section class="glass arcade reveal" id="arcade" data-g="snake" aria-label="Arcade">
    <div class="seg" id="seg"><i class="pill"></i><button class="on" data-g="snake">Snake</button><button data-g="tetris">Tetris</button></div>
    <div class="stack">
      <canvas id="cv" width="280" height="320"></canvas>
      <div class="over" id="over"><b id="overTitle"></b><span id="overSub"></span><button class="btn" id="play">Play</button></div>
    </div>
    <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
    <div class="pad" id="pad"><button data-k="L" aria-label="Left">&larr;</button><button data-k="U" aria-label="Up or rotate">&uarr;</button><button data-k="D" aria-label="Down">&darr;</button><button data-k="R" aria-label="Right">&rarr;</button><button data-k="X" aria-label="Drop">&#10515;</button></div>
  </section>
</main>
<div class="toast glass" id="toast" role="status"></div>

<dialog id="legal" aria-labelledby="legalTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="legalTitle"></h2><button class="close" id="legalClose" aria-label="Close">&times;</button></div>
    <div class="sheet-body" id="legalBody"></div>
  </div>
</dialog>

let queued = false, cur = 0, tgt = 0, flow = 0;
function frame() {
  queued = false;
  const y = scrollY, vh = innerHeight, max = root.scrollHeight - vh;
  $("prog").style.transform = `scaleX(${max > 0 ? clamp(y / max) : 0})`;
  $("top").classList.toggle("show", y > 500);

  const k = clamp(y / (vh * .6));

  hero.style.opacity = 1 - k * .9;

  const r = $("intro").getBoundingClientRect();
  tgt = clamp((vh * .92 - r.top) / (vh * .45 + r.height * .3));
  if (!flow) flow = requestAnimationFrame(step);
}
function step() {
  flow = 0;
  cur += (tgt - cur) * .12;
  if (Math.abs(tgt - cur) < .003) cur = tgt; else flow = requestAnimationFrame(step);
  const lit = cur * (words.length + 5);
  words.forEach((w, i) => { const o = Math.round(clamp((lit - i) / 5) * 20) / 20; if (w._o !== o) { w._o = o; w.style.opacity = .16 + .84 * o; } });
}
const queue = () => { if (!queued) { queued = true; requestAnimationFrame(frame); } };

/*snake and tetris*/
(() => {
  const cv = $("cv"), c = cv.getContext("2d"), ov = $("over"), box = $("arcade"), games = {}, bests = { snake: 0, tetris: 0 };
  let g, state = "idle", cc = "", ct = 0;
  const setState = v => { state = v; box.dataset.s = v; };
  const ink = () => { if (performance.now() - ct > 800) { cc = getComputedStyle(root).getPropertyValue("--ink-2"); ct = performance.now(); } return cc; };
  const setScore = v => { $("score").textContent = v; };
  const show = (t, s, b) => { $("overTitle").textContent = t; $("overSub").textContent = s; $("play").textContent = b; ov.hidden = false; };
  const finish = (n, sc) => { setState("idle"); bests[n] = Math.max(bests[n], sc); $("best").textContent = bests[n]; show("Game over", "You scored " + sc, "Play again"); };
  const same = (a, b) => a.x === b.x && a.y === b.y;
  const rc = (x, y, w, r) => { c.beginPath(); c.roundRect(x, y, w, w, r); c.fill(); };

  games.snake = (() => {
    const N = 14, R = 16, S = 20; let sn, dir, nxt, food, score, speed, timer;
    const spawn = () => { do food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * R) }; while (sn.some(p => same(p, food))); };
    const loop = () => { clearInterval(timer); timer = setInterval(tick, speed); };
    const stop = () => clearInterval(timer);
    function tick() {
      dir = nxt;
      const hd = { x: (sn[0].x + dir.x + N) % N, y: (sn[0].y + dir.y + R) % R };
      if (sn.some(p => same(p, hd))) { stop(); return finish("snake", score); }
      sn.unshift(hd);
      if (same(hd, food)) { score++; setScore(score); spawn(); if (speed > 70) { speed -= 5; loop(); } } else sn.pop();
      draw();
    }
    function draw() {
      c.clearRect(0, 0, 280, 320);
      c.fillStyle = ink(); c.globalAlpha = .18;
      for (let x = 0; x < N; x++) for (let y = 0; y < R; y++) c.fillRect(x * S + 9, y * S + 9, 2, 2);
      c.globalAlpha = 1;
      if (!sn) return;
      c.fillStyle = "#ff5a8a"; c.beginPath(); c.arc(food.x * S + 10, food.y * S + 10, 7, 0, 7); c.fill();
      sn.forEach((p, i) => { c.fillStyle = `hsl(${210 + i * 7} 90% 62%)`; rc(p.x * S + 1.5, p.y * S + 1.5, S - 3, i ? 6 : 9); });
    }
    return {
      hint: "Arrow keys, WASD, swipe or the buttons below", draw, stop, resume: loop,
      start() { sn = [{ x: 7, y: 8 }, { x: 6, y: 8 }, { x: 5, y: 8 }]; dir = nxt = { x: 1, y: 0 }; score = 0; speed = 150; setScore(0); spawn(); loop(); draw(); },
      key(k) { const v = { L: [-1, 0], R: [1, 0], U: [0, -1], D: [0, 1] }[k]; if (v && (v[0] !== -dir.x || v[1] !== -dir.y)) nxt = { x: v[0], y: v[1] }; }
    };
  })();

  games.tetris = (() => {
    const COLS = 10, ROWS = 20, S = 16, OX = 12, PX = 190;
    const SH = { I: [[1, 1, 1, 1]], O: [[1, 1], [1, 1]], T: [[0, 1, 0], [1, 1, 1]], S: [[0, 1, 1], [1, 1, 0]], Z: [[1, 1, 0], [0, 1, 1]], J: [[1, 0, 0], [1, 1, 1]], L: [[0, 0, 1], [1, 1, 1]] };
    const COL = { I: "#5ac8fa", O: "#ffd60a", T: "#bf5af2", S: "#30d158", Z: "#ff453a", J: "#0a84ff", L: "#ff9f0a" };
    let b, p, nx, score = 0, lines = 0, timer;
    const rand = () => Object.keys(SH)[Math.floor(Math.random() * 7)];
    const mk = k => ({ k, m: SH[k], x: 3, y: 0 });
    const hit = (m, x, y) => m.some((r, j) => r.some((v, i) => v && (x + i < 0 || x + i >= COLS || y + j >= ROWS || b[y + j][x + i])));
    const rot = m => m[0].map((_, i) => m.map(r => r[i]).reverse());
    const stop = () => clearInterval(timer);
    const tune = () => { stop(); timer = setInterval(down, Math.max(90, 650 - 55 * Math.floor(lines / 10))); };
    function lock() {
      p.m.forEach((r, j) => r.forEach((v, i) => { if (v) b[p.y + j][p.x + i] = p.k; }));
      b = b.filter(r => r.some(v => !v));
      const n = ROWS - b.length;
      while (b.length < ROWS) b.unshift(Array(COLS).fill(0));
      if (n) { lines += n; score += [0, 100, 300, 500, 800][n] * (1 + Math.floor(lines / 10)); setScore(score); tune(); }
      p = mk(nx); nx = rand();
      if (hit(p.m, p.x, p.y)) { stop(); finish("tetris", score); }
    }
    function down() { if (!hit(p.m, p.x, p.y + 1)) p.y++; else lock(); draw(); }
    function draw() {
      c.clearRect(0, 0, 280, 320);
      c.fillStyle = "rgba(127,127,127,.14)"; c.fillRect(OX, 0, COLS * S, ROWS * S);
      const cell = (x, y, k, s) => { c.fillStyle = COL[k]; rc(x + 1, y + 1, s - 2, 4); };
      if (b) b.forEach((r, j) => r.forEach((v, i) => v && cell(OX + i * S, j * S, v, S)));
      if (p) p.m.forEach((r, j) => r.forEach((v, i) => v && cell(OX + (p.x + i) * S, (p.y + j) * S, p.k, S)));
      if (nx) SH[nx].forEach((r, j) => r.forEach((v, i) => v && cell(PX + i * 14, 34 + j * 14, nx, 14)));
      c.fillStyle = ink(); c.font = "600 12px -apple-system,system-ui,sans-serif";
      c.fillText("NEXT", PX, 22); c.fillText("LINES", PX, 140); c.fillText("LEVEL", PX, 200);
      c.font = "700 22px -apple-system,system-ui,sans-serif";
      c.fillText(lines, PX, 168); c.fillText(1 + Math.floor(lines / 10), PX, 228);
    }
    return {
      hint: "Arrows to move and rotate, space or the drop button to slam down", draw, stop, resume: tune,
      start() { b = Array.from({ length: ROWS }, () => Array(COLS).fill(0)); score = lines = 0; setScore(0); nx = rand(); p = mk(rand()); nx = rand(); tune(); draw(); },
      key(k) {
        if (k === "L" && !hit(p.m, p.x - 1, p.y)) p.x--;
        else if (k === "R" && !hit(p.m, p.x + 1, p.y)) p.x++;
        else if (k === "D") return down();
        else if (k === "U") { const m = rot(p.m); for (const dx of [0, -1, 1, -2, 2]) if (!hit(m, p.x + dx, p.y)) { p.m = m; p.x += dx; break; } }
        else if (k === "X") { let d = 0; while (!hit(p.m, p.x, p.y + 1)) { p.y++; d++; } score += d * 2; setScore(score); lock(); }
        draw();
      }
    };
  })();

  const begin = r => { setState("play"); ov.hidden = true; r ? g.resume() : g.start(); };
  const pause = () => { if (state === "play") { g.stop(); setState("pause"); show("Paused", "Take your time", "Resume"); } };
  const select = n => {
    if (g) g.stop();
    g = games[n]; setState("idle"); box.dataset.g = n;
    $("seg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.g === n));
    setScore(0); $("best").textContent = bests[n];
    show(n === "snake" ? "Snake" : "Tetris", g.hint, "Play"); g.draw();
  };
  $("seg").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b) select(b.dataset.g); });
  $("play").addEventListener("click", () => begin(state === "pause"));
  $("pad").addEventListener("pointerdown", e => { const b = e.target.closest("[data-k]"); if (b && state === "play") { e.preventDefault(); g.key(b.dataset.k); } });
  addEventListener("keydown", e => {
    const k = { ArrowLeft: "L", a: "L", ArrowRight: "R", d: "R", ArrowUp: "U", w: "U", ArrowDown: "D", s: "D", " ": "X" }[e.key];
    if (k && state === "play") { e.preventDefault(); g.key(k); }
  });
  let t0;
  cv.addEventListener("touchstart", e => { t0 = e.touches[0]; }, { passive: true });
  cv.addEventListener("touchend", e => {
    const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
    if (state !== "play" || box.dataset.g !== "snake" || Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    g.key(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U"));
  });
  new IntersectionObserver(([e]) => { if (!e.isIntersecting) pause(); }).observe(box);
  document.addEventListener("visibilitychange", () => document.hidden && pause());
  select("snake");
})();

/*for the low enders*/
(() => {
  if ((navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.connection && navigator.connection.saveData)) return root.classList.add("lite");
  let f = 0, t0;
  const tick = t => {
    if (document.hidden) return;
    t0 = t0 || t; f++;
    if (t - t0 < 1500) requestAnimationFrame(tick);
    else if (f / ((t - t0) / 1000) < 40) root.classList.add("lite");
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
